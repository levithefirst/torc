name: demo-tick
# Advances the chipnet demo circle every 15 minutes (Vercel Hobby crons are daily only).
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/demo/tick
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET not set; skipping"; exit 0; fi
          curl -sS -m 40 -H "Authorization: Bearer $CRON_SECRET" https://torc-cash.vercel.app/api/demo/tick || true
